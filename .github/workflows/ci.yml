name: CI

# Runs on every push and pull request. Keeps the repo green across platforms
# and enforces the log-before-fix discipline - the tests are offline (the
# HTTP layer is mocked), so a broken change or a commit that names no logged
# decision cannot land silently.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: tests + linter (py ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile check
        run: python -m py_compile check_logs_ai.py

      - name: Unit tests (offline - HTTP mocked)
        run: python _test_logs_ai.py

      - name: Decision-log parse check (repo's own log)
        run: python check_logs_ai.py --review --dry-run

  docs-guard:
    name: README test-count drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Drift guard (README count vs actual suite)
        run: python3 _check_readme_count.py

  commit-gate:
    name: commit-message gate (log-before-fix)
    if: github.event_name == 'push' # PR merge commits carry no AREA marker; PRs are gated at merge/push time
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Re-run the gate on the pushed commit
        run: |
          git log -1 --format=%B > commit_msg.txt
          python3 check_logs_ai.py --check-commit commit_msg.txt
