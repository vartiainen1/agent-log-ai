[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-log-ai"
dynamic = ["version"]
description = "An LLM that reads your agent's error and decision logs and drafts root-cause lessons"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["ai", "agents", "claude", "llm", "ollama", "logs", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/vartiainen1/agent-log-ai"
Repository = "https://github.com/vartiainen1/agent-log-ai"
Changelog = "https://github.com/vartiainen1/agent-log-ai/blob/master/CHANGELOG.md"
Releases = "https://github.com/vartiainen1/agent-log-ai/releases"

[project.scripts]
log-ai = "check_logs_ai:main"

[tool.setuptools]
py-modules = ["check_logs_ai"]

[tool.setuptools_scm]
fallback_version = "0.0.0"
